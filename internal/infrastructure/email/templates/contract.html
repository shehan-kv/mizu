<!DOCTYPE html>
<html lang="en">
<body style="margin:0; padding:0; background-color:#ffffff; font-family:Arial, Helvetica, sans-serif;">

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#ffffff;">
    <tr>
        <td align="center" style="padding:64px 20px;">

            <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%; max-width:600px;">

                <tr>
                    <td style="padding-bottom:40px;">
                        <img
                            src="{{ .BaseURL }}/assets/logo-dark.svg"
                            width="100"
                            alt="Logo"
                            style="display:block;"
                        >
                    </td>
                </tr>

                <tr>
                    <td style="color:#333333;">

                        <h1 style="margin:0; font-size:22px; font-weight:600; line-height:1.3;">
                            {{ .ContractName }}
                        </h1>

                        <p style="margin:8px 0 0; font-size:16px; color:#666666;">
                            {{ .ProjectName }}
                        </p>

                    </td>
                </tr>

                <tr>
                    <td style="
                        padding:72px 0 0;
                        color:#333333;
                        font-size:16px;
                        line-height:1.8;
                        white-space:pre-wrap;
                    ">{{ .ContractTerms }}</td>
                </tr>

                <tr>
                    <td style="padding:64px 0 0; color:#333333;">
                        {{ range .Signatories }}
                            {{ if ne .Status "pending" }}
                                <div style="margin-bottom:32px;">

                                    <p style="margin:0; font-size:16px; font-weight:600;">
                                        {{ .FirstName }} {{ .LastName }} ({{ .Role }})
                                    </p>

                                    <p style="margin:8px 0 0; font-size:14px; color:#666666;">
                                        Signed On {{ .UpdatedAt.Format "02 January 2006 15:04 MST" }}
                                    </p>

                                </div>
                            {{ end }}
                        {{ end }}
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
